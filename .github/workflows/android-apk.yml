name: Build Mage Lori APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "Using keystore from secrets"
          else
            echo "No KEYSTORE_BASE64 secret - release APK will use the debug keystore"
          fi

      - name: Build debug + release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Name the APK files
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mage-lori-v${VER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/mage-lori-v${VER}-release.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: mage-lori-release-apk
          path: dist/*-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mage-lori-debug-apk
          path: dist/*-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-release.apk
